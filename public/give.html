<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FDF9F1">
<title>Give a card | Future Deck</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#0A1F3D;--berry:#B03A4E;--cream:#FDF9F1;--line:#EAD9D3;--soft:#4B5566;--sage:#3F6E64}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 64px}
h1{font-family:Georgia,serif;font-size:1.7rem;margin:0 0 4px}
.intro{color:var(--soft);margin:0 0 12px;font-size:.95rem}
.tools{position:sticky;top:0;z-index:2;background:var(--cream);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{min-height:46px;font:inherit;font-size:16px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=search]{flex:1 1 100%}
select{flex:1 1 50%}
button{min-height:46px;font:inherit;font-weight:600;padding:8px 14px;border:0;border-radius:10px;cursor:pointer}
.btn{background:var(--berry);color:#fff}
.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
#rand{flex:1 1 40%}
.count{color:var(--soft);font-size:.85rem;margin-top:6px}
h2{font-family:Georgia,serif;font-size:1.3rem;margin:26px 0 10px;border-bottom:2px solid var(--berry);padding-bottom:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;scroll-margin-top:150px}
.card.pick{border:3px solid var(--berry);box-shadow:0 10px 30px -12px rgba(176,58,78,.5)}
.card h3{margin:0 0 6px;font-family:Georgia,serif;font-size:1.12rem}
.card h3 span{color:var(--berry);font-size:.82rem;letter-spacing:.1em;margin-right:8px}
.deck{font-size:.72rem;font-weight:700;color:var(--sage);letter-spacing:.06em;text-transform:uppercase}
.msg{font-style:italic;margin:0 0 8px}
.lab{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--berry);margin:10px 0 2px}
.act{margin:0}
details{margin:8px 0 10px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
pre{white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:.86rem;background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide{grid-column:1 / -1}
.done{display:block;color:var(--sage);font-weight:600;font-size:.88rem;min-height:1.2em;margin-top:6px}
[hidden]{display:none !important}
</style>
</head>
<body>
<main>
  <h1>Give a card</h1>
  <p class="intro">Pick a card for someone, then share it or copy it into a comment or DM. Every card ends with a link to draw their own.</p>
  <div class="tools">
    <div class="row">
      <input type="search" id="q" placeholder="Search, e.g. voice note, price, sea" aria-label="Search the cards">
      <select id="deckpick" aria-label="Choose a deck"><option value="">Any deck</option><option value="pep">The Daily Pep</option><option value="fear">The Fear Buddy</option><option value="lift">The Lift</option><option value="break">Break the Pattern</option></select>
      <button class="btn" id="rand" type="button">Random card</button>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>
  <div id="out"></div>
</main>
<script src="/js/cards.js?v=20261023a"></script>
<script>
(function () {
  var D = window.FUTURE_DECK;
  var out = document.getElementById('out');
  var q = document.getElementById('q');
  var pick = document.getElementById('deckpick');
  var count = document.getElementById('count');
  if (!D) { out.textContent = 'The cards did not load. Refresh the page.'; return; }
  var names = { pep: 'The Daily Pep', fear: 'The Fear Buddy', lift: 'The Lift', break: 'Break the Pattern' };
  var anchors = { pep: 'daily-pep', fear: 'fear-buddy', lift: 'the-lift', break: 'break-the-pattern' };
  var defLabel = { pep: 'Your easy action', fear: 'Your easy action', lift: 'Pass it on' };
  var all = [];

  function el(t, c, txt) { var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }

  function socialText(k, c, prompt) {
    return 'Your card from the Future Deck: ' + c.name + ' (' + names[k] + ')\n\n' +
      '“' + c.message + '”\n\n' +
      (c.label || defLabel[k]) + ': ' + c.action + '\n\n' +
      'Your free AI prompt (paste it into ChatGPT, Claude or Gemini):\n\n' + prompt + '\n\n' +
      'Draw your own card: https://www.growingwomeninbusiness.com/cards#' + anchors[k];
  }

  function say(card, msg) {
    var s = card.querySelector('.done');
    s.textContent = msg;
    setTimeout(function () { s.textContent = ''; }, 3500);
  }

  // Copies inside the tap itself, which works on most phones; falls back to
  // the clipboard API, then to a box she can copy from by hand.
  function copyNow(text) {
    var t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', '');
    t.style.position = 'fixed'; t.style.top = '0'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(t);
    return ok;
  }

  function copy(text, card) {
    var done = function () { say(card, 'Copied. Paste it into your comment or DM.'); };
    if (copyNow(text)) { done(); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy this:', text); });
    } else {
      window.prompt('Copy this:', text);
    }
  }

  ['pep', 'fear', 'lift', 'break'].forEach(function (k) {
    var h = el('h2', null, names[k] + ', ' + D[k].length + ' cards');
    h._deck = k;
    out.appendChild(h);
    D[k].forEach(function (c) {
      var prompt = D.promptFor(k, c);
      var card = el('div', 'card');
      var h3 = el('h3');
      card.appendChild(el('div', 'deck', names[k]));
      h3.appendChild(el('span', null, c.n));
      h3.appendChild(document.createTextNode(c.name));
      card.appendChild(h3);
      card.appendChild(el('p', 'msg', c.message));
      card.appendChild(el('p', 'lab', c.label || defLabel[k]));
      card.appendChild(el('p', 'act', c.action));
      var det = el('details');
      det.appendChild(el('summary', null, 'See the AI prompt'));
      det.appendChild(el('pre', null, prompt));
      card.appendChild(det);
      var a = el('div', 'actions');
      var bShare = el('button', 'btn wide', 'Share card + prompt');
      var bCopy = el('button', 'ghost', 'Copy card + prompt');
      var bPrompt = el('button', 'ghost', 'Copy prompt only');
      bShare.type = bCopy.type = bPrompt.type = 'button';
      bShare.addEventListener('click', function () {
        var text = socialText(k, c, prompt);
        if (navigator.share) { navigator.share({ text: text }).catch(function () {}); }
        else { copy(text, card); }
      });
      bCopy.addEventListener('click', function () { copy(socialText(k, c, prompt), card); });
      bPrompt.addEventListener('click', function () { copy(prompt, card); });
      a.appendChild(bShare); a.appendChild(bCopy); a.appendChild(bPrompt);
      card.appendChild(a);
      card.appendChild(el('span', 'done'));
      card._deck = k;
      card._text = (c.name + ' ' + c.message + ' ' + c.action + ' ' + names[k]).toLowerCase();
      out.appendChild(card);
      all.push(card);
    });
  });

  function filter() {
    var t = q.value.trim().toLowerCase(), d = pick.value, n = 0;
    all.forEach(function (c) {
      var show = (!d || c._deck === d) && (!t || c._text.indexOf(t) > -1);
      c.hidden = !show;
      if (show) n++;
      c.classList.remove('pick');
    });
    Array.prototype.forEach.call(out.querySelectorAll('h2'), function (h) {
      h.hidden = !all.some(function (c) { return c._deck === h._deck && !c.hidden; });
    });
    count.textContent = n + ' of ' + all.length + ' cards showing';
  }

  q.addEventListener('input', filter);
  pick.addEventListener('change', filter);
  document.getElementById('rand').addEventListener('click', function () {
    q.value = '';
    filter();
    var pool = all.filter(function (c) { return !c.hidden; });
    var c = pool[Math.floor(Math.random() * pool.length)];
    c.classList.add('pick');
    c.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  filter();
})();
</script>
</body>
</html>
