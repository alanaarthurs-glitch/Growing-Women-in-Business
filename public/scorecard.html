<html lang="en-GB">
<head>

<style>
  :root {
    /* Brand tokens: Growing Women in Business (Brand OS, 22 Jul 2026) */
    --ink: #0A1F3D;          /* navy: headings and body text */
    --muted: #4B5566;        /* secondary text (4.5:1+ on cream) */
    --bg: #FDF9F1;           /* cream page background */
    --card: #FFFFFF;         /* card background */
    --accent: #DF8491;       /* rose pink: bars and highlights only (not text) */
    --sage: #3F6E64;         /* deep sage, third brand colour */
    --button: #B03A4E;       /* deep berry, white text 4.5:1+ */
    --button-hover: #7E2836;
    /* Both gradient ends carry white text at 4.5:1 or better (the old rose end did not) */
    --grad: linear-gradient(135deg, #7E2836 0%, #B03A4E 100%);
    --grad-deep: linear-gradient(135deg, #0A1F3D 0%, #7E2836 130%);
    --line: #EAD9D3;
    --focus: #3F6E64;        /* deep sage focus outline */
    --error: #B42318;
    --head-font: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --body-font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--ink);
    font-family: var(--body-font); font-size: 17px; line-height: 1.55;
    background: var(--bg);
    position: relative; overflow-x: hidden;
  }
  /* Decorative background glow: brand colours only, sits behind everything */
  .bg-decor { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-decor span {
    position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35;
  }
  .bg-decor span:nth-child(1) { width: 46vw; height: 46vw; max-width: 460px; max-height: 460px; top: -14vw; right: -12vw; background: radial-gradient(circle, #DF8491 0%, transparent 70%); }
  .bg-decor span:nth-child(2) { width: 40vw; height: 40vw; max-width: 400px; max-height: 400px; bottom: -12vw; left: -14vw; background: radial-gradient(circle, #3F6E64 0%, transparent 70%); opacity: .22; }
  .bg-decor span:nth-child(3) { width: 30vw; height: 30vw; max-width: 320px; max-height: 320px; top: 32vh; left: 55vw; background: radial-gradient(circle, #0A1F3D 0%, transparent 72%); opacity: .10; }
  .wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 32px 16px 48px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px; margin: 0 0 14px;
    padding: 6px 14px; border-radius: 99px; background: var(--grad); color: #fff;
    font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    box-shadow: 0 6px 16px rgba(176, 58, 78, .25);
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 26px 20px; box-shadow: 0 18px 40px -14px rgba(10, 31, 61, .18), 0 2px 10px rgba(10, 31, 61, .06);
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--grad);
  }
  @media (min-width: 600px) { .card { padding: 40px 44px; } }
  h1, h2 { font-family: var(--head-font); font-weight: 600; line-height: 1.12; margin: 0 0 12px; letter-spacing: -.01em; }
  h1 { font-size: 2.1rem; }
  h2 { font-size: 1.6rem; }
  /* The question and the result greeting are h1s (one per screen) but keep the old h2 size */
  #q-text, #r-greeting { font-size: 1.6rem; }
  @media (min-width: 600px) { h1 { font-size: 2.7rem; } h2 { font-size: 1.9rem; } #q-text, #r-greeting { font-size: 1.9rem; } }
  h2:focus, h1:focus { outline: none; }
  p { margin: 0 0 14px; }
  a { color: var(--ink); }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  .owner { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
  .owner img, .owner .initials {
    width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none;
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--accent);
  }
  .owner .initials {
    display: grid; place-items: center; background: var(--grad-deep); color: #fff;
    font-weight: 700; letter-spacing: .5px;
  }
  .owner strong { display: block; }
  .owner em { color: var(--muted); font-style: italic; }
  .promise { font-size: 1.08rem; color: var(--muted); }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type="text"], input[type="email"] {
    width: 100%; min-height: 48px; padding: 10px 14px; font: inherit; color: var(--ink);
    border: 2px solid var(--line); border-radius: 10px; background: #fff;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]:focus, input[type="email"]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(223, 132, 145, .18); }
  input[aria-invalid="true"] { border-color: var(--error); }
  .field-error { color: var(--error); font-size: .9rem; margin: 6px 0 0; min-height: 1em; }
  .field-error:empty { margin: 0; min-height: 0; }
  .consent { display: flex; gap: 12px; align-items: flex-start; margin: 18px 0 6px; font-weight: 400; }
  .consent input { width: 24px; height: 24px; margin: 2px 0 0; flex: none; accent-color: var(--button); }
  .btn, .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 54px; padding: 12px 26px; border: 0; border-radius: 14px;
    background: var(--grad); color: #fff; font: inherit; font-weight: 700; font-size: 1.02rem;
    text-decoration: none; cursor: pointer; width: 100%;
    box-shadow: 0 10px 24px -8px rgba(176, 58, 78, .5);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  @media (min-width: 600px) { .btn, .cta { width: auto; } }
  /* Long button labels wrap between words instead of overflowing */
  .btn, .cta { max-width: 100%; white-space: normal; text-align: center; text-wrap: balance; overflow-wrap: break-word; }
  /* Brand bar at the top of the card: logo and name, links home */
  .brand { margin: 0 0 14px; }
  .brand a { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; letter-spacing: .02em; }
  .brand a:hover span { text-decoration: underline; }
  .brand img { width: 40px; height: 40px; flex: none; }
  /* Honeypot: hidden from people and screen readers, bots fill it in */
  .hp { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
  /* Primary next step, straight under the tier name */
  .cta-top { text-align: center; margin: 0 0 22px; }
  .cta-top .lead { font-weight: 600; margin: 0 0 10px; }
  .signup-done { font-weight: 700; color: var(--sage); margin: 0; }
  .share-row { text-align: center; margin: 8px 0 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .secondary { background: #fff; color: var(--button); border: 2px solid var(--button); box-shadow: none; }
  .secondary:hover { background: #FBEBEA; }
  .btn:hover, .cta:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -8px rgba(176, 58, 78, .55); filter: brightness(1.04); }
  .btn:active, .cta:active { transform: translateY(0); }
  .link-btn {
    background: none; border: 0; padding: 10px 4px; min-height: 44px; font: inherit;
    color: var(--ink); text-decoration: underline; cursor: pointer;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .progress-text { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); margin: 0 0 8px; }
  .progress { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 0 0 24px; }
  .progress > div { height: 100%; width: 0; background: var(--grad); border-radius: 99px; transition: width .35s cubic-bezier(.22,.61,.36,1); }
  .qhelp { color: var(--muted); margin-top: -4px; }
  .answers { display: grid; gap: 10px; margin: 20px 0 8px; }
  .answer {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px;
    padding: 12px 16px; text-align: left; font: inherit; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .answer:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 8px 18px -10px rgba(10, 31, 61, .25); }
  .answer[aria-pressed="true"] {
    border-color: transparent; background: linear-gradient(0deg, #FBEBEA, #FBEBEA) padding-box, var(--grad) border-box;
    border-width: 2px; border-style: solid; box-shadow: 0 8px 18px -10px rgba(176, 58, 78, .35);
  }
  .answer[aria-pressed="true"] .key { background: var(--grad); color: #fff; border-color: transparent; }
  .answer .key {
    flex: none; width: 28px; height: 28px; display: grid; place-items: center;
    border: 1.5px solid var(--line); border-radius: 8px; font-size: .85rem; color: var(--muted);
    transition: background .12s ease, color .12s ease;
  }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .score-label { font-size: .95rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 8px 0 14px; text-align: center; }
  #r-score-wrap { text-align: center; }
  .score-ring {
    --pct: 0;
    width: 168px; height: 168px; margin: 0 auto 18px; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    background: conic-gradient(#B03A4E calc(var(--pct) * 1%), #EAD9D3 0);
    box-shadow: 0 16px 36px -14px rgba(176, 58, 78, .4);
  }
  .score-ring::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--card); }
  .score {
    font-family: var(--head-font); font-size: 3.3rem; line-height: 1; margin: 0; color: var(--ink);
    position: relative; z-index: 1; font-weight: 600;
  }
  .headline { font-size: 1.25rem; font-weight: 700; margin: 0 0 10px; text-align: center; }
  .tier-name {
    display: block; width: fit-content; margin: 0 auto 18px; background: var(--grad-deep); color: #fff; border-radius: 99px;
    padding: 6px 18px; font-weight: 700; font-size: .95rem; letter-spacing: .01em;
    box-shadow: 0 8px 18px -10px rgba(10, 31, 61, .45);
  }
  #r-means { text-align: center; max-width: 52ch; margin-left: auto; margin-right: auto; }
  h3, h2.sub { font-size: 1.15rem; margin: 30px 0 14px; }
  /* Result sub-headings are h2s now the greeting is the h1, but look as they did */
  h2.sub { font-family: var(--body-font); font-weight: 700; line-height: 1.2; letter-spacing: 0; }
  .bars { list-style: none; padding: 0; margin: 0; display: grid; gap: 18px; }
  .bar-head { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
  .track { height: 14px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; background: var(--grad); border-radius: 99px; width: 0; transition: width .8s cubic-bezier(.22,.61,.36,1); }
  .bar-note { color: var(--muted); font-size: .95rem; margin: 6px 0 0; }
  .wins { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .wins li {
    position: relative; padding: 12px 16px 12px 44px; background: #FBF6F2; border: 1px solid var(--line);
    border-radius: 12px; font-weight: 500;
  }
  .wins li::before {
    content: counter(win); counter-increment: win;
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%; background: var(--grad); color: #fff;
    font-size: .8rem; font-weight: 700; display: grid; place-items: center;
  }
  .wins { counter-reset: win; }
  .next { margin-top: 28px; padding: 22px; border-radius: 16px; background: linear-gradient(160deg, #FBEBEA 0%, #FDF9F1 100%); border: 1px solid var(--line); }
  .next p { margin-bottom: 14px; text-align: center; }
  .disclaimer { margin-top: 20px; font-size: .9rem; color: var(--muted); }
  footer.foot { text-align: center; margin-top: 24px; font-size: .9rem; color: var(--muted); position: relative; z-index: 1; }
  footer.foot a { color: var(--ink); }
  @media (pointer: coarse) { .key-tip { display: none; } }
  /* Phones: tighten the start screen so "Get my score" shows without scrolling at 375 x 812 */
  @media (max-width: 599px) {
    .wrap { padding-top: 12px; }
    .card { padding-top: 18px; }
    .brand { margin-bottom: 4px; }
    .brand img { width: 36px; height: 36px; }
    .owner { margin-bottom: 12px; }
    .owner em { font-size: .9rem; line-height: 1.35; display: block; }
    .eyebrow { font-size: .72rem; letter-spacing: .04em; padding: 5px 12px; margin-bottom: 10px; }
    .promise { font-size: 1rem; }
    label { margin-top: 12px; }
    .consent { margin-top: 14px; }
    .btn, .cta { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.skip-link-sc{position:absolute;left:.75rem;top:-100px;background:#0A1F3D;color:#fff;padding:.75rem 1rem;border-radius:8px;z-index:100}.skip-link-sc:focus{top:.75rem}</style>
</head>
<body>
  <a class="skip-link-sc" href="#sc-main">Skip to the Visibility Score</a>
<div class="bg-decor" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="wrap">
  <main class="card" id="sc-main" tabindex="-1">
    <div class="brand">
      <a href="/"><img src="/images/mark.svg" alt="" width="40" height="40"><span>Growing Women in Business</span></a>
    </div>

    <!-- SCREEN 1: hook + details (captured FIRST) -->
    <section id="screen-start" class="screen" aria-labelledby="start-title">
      <div class="owner" id="owner"></div>
      <span class="eyebrow">Free Visibility Score &middot; about 2 minutes</span>
      <h1 id="start-title" tabindex="-1" data-focus></h1>
      <p class="promise" id="start-promise"></p>
      <form id="details" novalidate>
        <label for="first-name">First name</label>
        <input id="first-name" name="first-name" type="text" autocomplete="given-name" required aria-describedby="first-name-error">
        <p class="field-error" id="first-name-error" aria-live="polite"></p>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-error">
        <p class="field-error" id="email-error" aria-live="polite"></p>

        <label class="consent" for="consent">
          <input id="consent" name="consent" type="checkbox">
          <span id="consent-text"></span>
        </label>
        <p class="small muted" id="privacy-line"></p>
        <div class="hp" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <button class="btn" type="submit" id="start-btn"></button>
      </form>
    </section>

    <!-- SCREEN 2: one question at a time -->
    <section id="screen-question" class="screen" hidden aria-labelledby="q-text">
      <div class="progress-text"><span id="q-count"></span><span id="q-time"></span></div>
      <div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" id="progress"><div id="progress-fill"></div></div>
      <h1 id="q-text" tabindex="-1" data-focus></h1>
      <p class="qhelp" id="q-help" hidden></p>
      <div class="answers" role="group" aria-labelledby="q-text" id="answers"></div>
      <div class="nav">
        <button type="button" class="link-btn" id="back-btn">&larr; Back</button>
        <span class="small muted key-tip">Tip: press 1&ndash;<span id="key-max">4</span></span>
      </div>
    </section>

    <!-- SCREEN 3: result -->
    <section id="screen-result" class="screen" hidden aria-labelledby="r-greeting">
      <h1 id="r-greeting" tabindex="-1" data-focus></h1>
      <div id="r-score-wrap">
        <p class="score-label">Your Visibility Score</p>
        <div class="score-ring" id="score-ring" aria-hidden="false">
          <p class="score" id="r-score"></p>
        </div>
      </div>
      <p class="tier-name" id="r-tier"></p>
      <div class="cta-top" id="r-cta-top"></div>
      <p class="headline" id="r-title"></p>
      <p id="r-means"></p>

      <h2 class="sub" id="r-bars-title"></h2>
      <ul class="bars" id="r-bars"></ul>

      <h2 class="sub">Your top 3 quick wins</h2>
      <ol class="wins" id="r-wins"></ol>

      <div class="next">
        <p id="r-next-line"></p>
        <div id="r-cta-bottom"></div>
      </div>

      <p class="disclaimer" id="r-disclaimer" hidden></p>
      <p><button type="button" class="link-btn" id="retake-btn">Take it again</button></p>
    </section>

  </main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
/* =====================================================================
   CONFIG: the only part you edit. Final copy only, no placeholders.
   ===================================================================== */
const CONFIG = {
  mode: "scorecard",
  business: "Growing Women in Business",
  owner: {
    name: "Alana Arthurs",
    catchphrase: "Built everyone else's life. Not yet your own. Let's fix that.",
    photo: "/images/alana-face.jpg",
    photoAlt: "Photo of Alana Arthurs"
  },
  title: "You built it. Can anybody find it?",
  promise: "11 quick questions. 2 minutes. You get a score out of 100, the one thing quietly losing you customers, and a ten-minute fix you can do tonight.",
  startButton: "Get my Visibility Score",
  consentText: "Yes, send me the odd message from Growing Women in Business. Real tips, no spam, unsubscribe whenever.",
  privacyUrl: "/privacy.html",
  secondsPerQuestion: 10,
  disclaimer: "",

  // Shown as the main button when someone in the lowest tier says she wants
  // help soon ("In the next few weeks" or "I'd like some help with this").
  hotCall: { lead: "You said you'd like a hand.", text: "Book a free 30-minute call",
             href: "https://calendly.com/alana-arthurs/findable-call?utm_source=scorecard&utm_medium=web&utm_campaign=findable-score-hot" },
  // The one-tap newsletter sign-up for the lowest tier.
  signup: { button: "Yes, send me The Only Way Is Up", done: "You're on the list. Watch your inbox.",
            already: "You're on the list", failed: "That didn't go through. Please try again in a minute." },
  share: { button: "Share my score", copied: "Copied",
           text: "I scored {pct}% on the Visibility Score. Can anybody find what you've built? Two minutes:",
           url: "https://www.growingwomeninbusiness.com/scorecard?utm_source=share&utm_medium=social&utm_campaign=findable-score" },

  categories: [
    { id: "found", name: "Can people find you?",
      notes: { low: "Right now, someone ready to pay you couldn't reach you if she tried.",
               mid: "Your mates can find you. Strangers can't. Strangers are where the money is.",
               high: "A total stranger could find you and message you today. That's the dream." },
      tips:  { low: "Tonight, Google your name and what you do. Whatever shows up first is what a customer sees. Now you know what to fix.",
               mid: "One link, everywhere. Bio, email signature, WhatsApp status. Nobody should have to hunt for you.",
               high: "Ask the last three people who found you how they did it. Then do more of that." } },
    { id: "offer", name: "Is there one clear thing to buy?",
      notes: { low: "There's nothing with a price on it yet, so nobody can say yes to you.",
               mid: "You've got something to sell. It's just not one sentence with a number yet.",
               high: "You can say what you sell, who it's for and what it costs without pausing. Rare." },
      tips:  { low: "Fill this in on paper: I help ___ with ___ for £___. Rough is fine. Written down beats perfect.",
               mid: "Take the thing people ask you for most. Put a price on it this week. Ignore the rest for now.",
               high: "Say your one sentence out loud to someone who isn't family. Watch their face. That's your edit." } },
    { id: "showing", name: "Do you actually show up?",
      notes: { low: "The women who'd buy from you haven't seen you yet. Not once.",
               mid: "You post in bursts, then vanish. They forget you in between.",
               high: "People see you every week and know exactly what you're about." },
      tips:  { low: "Today, tell one real person in one sentence what you're building. Out loud. It's harder to cancel on yourself once someone's heard it.",
               mid: "Post one plain thing this week that says what you do and who it's for. No polish. Done beats pretty.",
               high: "Pick a day and a time. Post every week at that time. The habit sells more than any one post." } }
  ],
  categoryBands: { mid: 40, high: 75 },

  questions: [
    { category: "found", text: "The Google test. Someone searches your name and what you do. What do they get?",
      answers: [["Me, right near the top", 3], ["Me, if they scroll a bit", 2],
                ["Honestly, no idea", 1], ["Nothing of mine", 0]] },
    { category: "offer", text: "The one-breath test. What do you sell? Say it out loud, right now.",
      answers: [["Not yet. A few ideas though", 1], ["Nailed it, price and all", 3],
                ["Sort of. It changes depending who asks", 2], ["Nothing to sell yet", 0]] },
    { category: "showing", text: "When did you last post something that said what you actually do?",
      answers: [["This week", 3], ["This month", 2], ["A while ago", 1], ["Never", 0]] },
    { category: "found", text: "Someone wants to buy from you or book you. Where do they go?",
      answers: [["They message me and we sort it", 1], ["One link I send everyone", 3],
                ["A page, but it's out of date", 2], ["Nowhere yet", 0]] },
    { category: "offer", text: "How did you land on your price?",
      answers: [["Looked at everyone else and went a bit lower", 1], ["Worked out what it's actually worth to them", 3],
                ["There isn't one yet", 0], ["Guessed, and I keep changing it", 2]] },
    { category: "showing", text: "The dinner table test. Someone asks what you do. What comes out?",
      answers: [["I say it straight and they get it", 3], ["I mention it, then change the subject", 1],
                ["I explain it, but it goes on a bit", 2], ["My old job, or nothing", 0]] },
    { category: "found", text: "Your last customer or enquiry. How did she find you?",
      answers: [["Friend or family", 1], ["Found me online. Never met me", 3],
                ["Someone I know shared it", 2], ["Haven't had one yet", 0]] },
    { category: "offer", text: "A stranger lands on your page. Does she know what to do next?",
      answers: [["Yes. One clear thing to buy or book", 3], ["She'd see what I do, not what to do", 2],
                ["She'd probably be confused", 1], ["There's no page", 0]] },
    { category: "showing", text: "The 11pm test. Putting yourself out there. How's it actually going?",
      answers: [["Scared, but I do it anyway", 3], ["I plan it at 11pm. Gone by morning", 1],
                ["Bursts of brave, then I hide", 2], ["I can't. Not yet", 0]] },
    { insight: true, key: "timeline", text: "When do you want strangers to be able to find you and buy from you?",
      answers: [["In the next few weeks", null, { hot: true }], ["Before the end of the year", null],
                ["Some day", null], ["Just curious for now", null]] },
    { insight: true, key: "blocker", text: "What's really in the way?",
      answers: [["I don't know what I'd sell", null], ["I don't know how to build the page or the posts", null],
                ["The fear. I talk myself out of it by morning", null], ["I'd like some help with this", null, { hot: true }]] }
  ],

  tiers: [
    { min: 75, name: "Findable. Not yet paid.",
      headline: "People can find you. Now let's make it pay.",
      means: "You've done the part most women never get to. You show up, you've got a page, you can say what you sell. What's left is small and specific: one offer, said often enough that people say yes. Fix that and this stops being a side thing and starts paying you.",
      wins: ["Say your one-sentence offer, price included, to three people this week. Count who asks a question back.",
             "Put a price and one button on the thing you sell most. Take everything else off that page.",
             "Pick a posting day. Keep it for four weeks, whatever happens."],
      nextLine: "Next: a free 30-minute call with Alana. You leave knowing the one thing between you and getting paid for this, and the first step to take this week. Pick a time that suits you.",
      cta: { text: "Book my free 30-minute call", href: "https://calendly.com/alana-arthurs/findable-call?utm_source=scorecard&utm_medium=web&utm_campaign=findable-score" } },
    { min: 40, name: "Two fixes from findable",
      headline: "Solid foundations. Two gaps between you and strangers finding you.",
      means: "You've built something real. Right now it only reaches people who already know you, and the offer isn't yet one sentence with a number on it. That's the difference between the odd order and a proper income. Once you can see the two gaps, they close fast.",
      wins: ["Fill this in on paper: I help ___ with ___ for £___.",
             "One link, everywhere, so nobody has to hunt for you.",
             "Post one plain thing this week that says what you do and who it's for."],
      nextLine: "Next: a free 30-minute call with Alana. You leave knowing which gap to fix first, and exactly how. Pick a time that suits you.",
      cta: { text: "Book my free 30-minute call", href: "https://calendly.com/alana-arthurs/findable-call?utm_source=scorecard&utm_medium=web&utm_campaign=findable-score" } },
    { min: 0, name: "Ready to be found",
      headline: "What you've built is real. Nobody can see it yet. Fixable.",
      means: "This is where nearly everyone starts. It's where Alana started. The skills are there, from years poured into work, kids, or someone else's plans. They just don't have a name, a page or a price on them yet. The first step takes ten minutes, costs nothing, and you can do it tonight.",
      wins: ["Tell one real person today, in one sentence, what you're building.",
             "Write your receipts list: ten things you've actually run, fixed or held together. That's your skills page.",
             "Fill this in on paper: I help ___ with ___ for £___. Rough is fine."],
      nextLine: "Next: The Only Way Is Up, Alana's newsletter, every other Sunday. One true story about fear and what it costs, and one thing to do before Monday so the week starts with you a step on.",
      cta: { signup: true } }
  ],

  outcomes: []
};

/* =====================================================================
   ENGINE: plain DOM, no libraries, sends nothing anywhere.
   ===================================================================== */
(function () {
  const $ = (id) => document.getElementById(id);
  const C = CONFIG;
  const Q = C.questions.map((q) => ({
    ...q,
    answers: q.answers.map(([label, points, extra]) => ({ label, points, ...(extra || {}) }))
  }));
  // sent: the result is posted once per page load, so "Take it again" never sends a second email.
  const state = { i: 0, picks: new Array(Q.length).fill(null), person: null, utm: {}, sent: false, subscribed: false };
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // UTM tags from the address bar, kept in memory only (for wiring up later)
  try {
    const params = new URLSearchParams(window.location.search);
    ["utm_source", "utm_medium", "utm_campaign"].forEach((k) => { if (params.get(k)) state.utm[k] = params.get(k); });
  } catch (e) { /* file:// or old browser: fine */ }

  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => { s.hidden = s.id !== id; });
    const target = document.querySelector("#" + id + " [data-focus]");
    window.scrollTo(0, 0);
    if (target) target.focus();
  }

  // ---- Screen 1
  function renderStart() {
    document.title = "Your Visibility Score | " + C.business;
    $("start-title").textContent = C.title;
    $("start-promise").textContent = C.promise;
    $("consent-text").textContent = C.consentText;
    $("start-btn").textContent = C.startButton;
    const owner = $("owner");
    const initials = C.owner.name.split(" ").map((w) => w[0]).join("").slice(0, 2);
    owner.innerHTML = "";
    const img = document.createElement("img");
    img.src = C.owner.photo; img.alt = C.owner.photoAlt; img.width = 52; img.height = 52;
    img.onerror = () => { const d = document.createElement("span"); d.className = "initials"; d.setAttribute("aria-hidden", "true"); d.textContent = initials; img.replaceWith(d); };
    const text = document.createElement("div");
    const s = document.createElement("strong"); s.textContent = C.owner.name;
    const e = document.createElement("em"); e.textContent = C.owner.catchphrase;
    text.append(s, e); owner.append(img, text);
    const priv = $("privacy-line");
    if (C.privacyUrl) {
      priv.textContent = "Your result shows on screen as soon as you finish. ";
      const a = document.createElement("a"); a.href = C.privacyUrl; a.textContent = "How we use your details";
      priv.append(a, ".");
    } else { priv.textContent = "Your result shows on screen as soon as you finish."; }
    const foot = $("foot");
    foot.textContent = C.owner.name + " · " + C.business + " · " + C.owner.catchphrase;
    if (C.privacyUrl) {
      const pa = document.createElement("a"); pa.href = C.privacyUrl; pa.textContent = "Privacy";
      foot.append(" · ", pa);
    }
  }

  $("details").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const name = $("first-name"), email = $("email");
    let ok = true;
    const setErr = (input, errId, msg) => {
      $(errId).textContent = msg; input.setAttribute("aria-invalid", msg ? "true" : "false");
      if (msg && ok) { input.focus(); ok = false; }
    };
    setErr(name, "first-name-error", name.value.trim() ? "" : "Please add your first name.");
    setErr(email, "email-error", /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim()) ? "" : "Please add an email address, like name@example.com.");
    if (!ok) return;
    state.person = {
      firstName: name.value.trim().split(" ")[0],
      email: email.value.trim(),
      marketingConsent: $("consent").checked,
      website: $("website").value
    };
    state.subscribed = state.person.marketingConsent;
    state.i = 0;
    renderQuestion();
    show("screen-question");
  });

  // ---- Screen 2
  function renderQuestion() {
    const q = Q[state.i];
    const n = Q.length;
    $("q-count").textContent = "Question " + (state.i + 1) + " of " + n;
    const secsLeft = (n - state.i) * (C.secondsPerQuestion || 10);
    $("q-time").textContent = secsLeft >= 60 ? "About " + Math.round(secsLeft / 60) + " min left" : "Nearly there";
    const p = $("progress");
    p.setAttribute("aria-valuemax", String(n));
    p.setAttribute("aria-valuenow", String(state.i));
    p.setAttribute("aria-valuetext", "Question " + (state.i + 1) + " of " + n);
    $("progress-fill").style.width = Math.round((state.i / n) * 100) + "%";
    $("q-text").textContent = q.text;
    const help = $("q-help");
    help.hidden = !q.help; help.textContent = q.help || "";
    const box = $("answers");
    box.innerHTML = "";
    q.answers.forEach((a, k) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "answer";
      b.setAttribute("aria-pressed", state.picks[state.i] === k ? "true" : "false");
      const key = document.createElement("span"); key.className = "key"; key.setAttribute("aria-hidden", "true"); key.textContent = String(k + 1);
      const lab = document.createElement("span"); lab.textContent = a.label;
      b.append(key, lab);
      b.addEventListener("click", () => pick(k, b));
      box.append(b);
    });
    $("key-max").textContent = String(q.answers.length);
    $("back-btn").style.visibility = state.i === 0 ? "hidden" : "visible";
  }

  function pick(k, btn) {
    state.picks[state.i] = k;
    document.querySelectorAll("#answers .answer").forEach((b) => b.setAttribute("aria-pressed", "false"));
    if (btn) btn.setAttribute("aria-pressed", "true");
    const advance = () => {
      if (state.i < Q.length - 1) { state.i += 1; renderQuestion(); $("q-text").focus(); }
      else { renderResult(); show("screen-result"); }
    };
    reduceMotion ? advance() : setTimeout(advance, 220);
  }

  $("back-btn").addEventListener("click", () => {
    if (state.i > 0) { state.i -= 1; renderQuestion(); $("q-text").focus(); }
  });

  document.addEventListener("keydown", (ev) => {
    if ($("screen-question").hidden) return;
    if (ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    const k = parseInt(ev.key, 10);
    if (k >= 1 && k <= Q[state.i].answers.length) {
      ev.preventDefault();
      pick(k - 1, document.querySelectorAll("#answers .answer")[k - 1]);
    }
  });

  // ---- Scoring
  const picked = (qi) => (state.picks[qi] === null ? null : Q[qi].answers[state.picks[qi]]);
  const band = (pct) => (pct >= C.categoryBands.high ? "high" : pct >= C.categoryBands.mid ? "mid" : "low");

  function scoreIt() {
    const hot = Q.some((q, qi) => picked(qi) && picked(qi).hot);
    const insights = {};
    Q.forEach((q, qi) => { if (q.insight && picked(qi)) insights[q.key] = picked(qi).label; });

    if (C.mode === "type") {
      const counts = {}; let total = 0;
      C.outcomes.forEach((o) => { counts[o.id] = 0; });
      Q.forEach((q, qi) => { const a = picked(qi); if (a && a.outcome) { counts[a.outcome] += 1; total += 1; } });
      let best = C.outcomes[0];
      C.outcomes.forEach((o) => { if (counts[o.id] > counts[best.id]) best = o; }); // ties: earlier outcome wins
      const mix = C.outcomes.map((o) => ({ id: o.id, name: o.name, pct: total ? Math.round((counts[o.id] / total) * 100) : 0 }));
      return { mode: "type", outcome: best, mix, hot, insights };
    }

    let got = 0, max = 0;
    const cats = C.categories.map((c) => ({ ...c, got: 0, max: 0 }));
    Q.forEach((q, qi) => {
      if (q.insight) return;
      const qMax = Math.max(...q.answers.map((a) => a.points || 0));
      const a = picked(qi); const pts = a ? (a.points || 0) : 0;
      got += pts; max += qMax;
      const cat = cats.find((c) => c.id === q.category);
      if (cat) { cat.got += pts; cat.max += qMax; }
    });
    const pct = max ? Math.round((got / max) * 100) : 0;
    cats.forEach((c) => { c.pct = c.max ? Math.round((c.got / c.max) * 100) : 0; c.band = band(c.pct); });
    const tier = C.tiers.find((t) => pct >= t.min && (!t.requiresHot || hot)) || C.tiers[C.tiers.length - 1];
    // Quick wins: weakest category first, then the tier's own wins to fill to three
    const wins = [];
    [...cats].sort((a, b) => a.pct - b.pct).forEach((c) => { const t = c.tips && c.tips[c.band]; if (t && !wins.includes(t)) wins.push(t); });
    (tier.wins || []).forEach((w) => { if (!wins.includes(w)) wins.push(w); });
    return { mode: C.mode, pct, got, max, cats, tier, wins: wins.slice(0, 3), hot, insights };
  }

  // ---- Screen 3
  function bar(name, pct, note) {
    const li = document.createElement("li");
    const head = document.createElement("div"); head.className = "bar-head";
    const n = document.createElement("span"); n.textContent = name;
    const v = document.createElement("span"); v.textContent = pct + "%";
    head.append(n, v);
    const track = document.createElement("div"); track.className = "track"; track.setAttribute("aria-hidden", "true");
    const fill = document.createElement("div"); fill.className = "fill"; fill.style.width = Math.max(pct, 2) + "%";
    track.append(fill); li.append(head, track);
    if (note) { const p = document.createElement("p"); p.className = "bar-note"; p.textContent = note; li.append(p); }
    return li;
  }

  function renderResult() {
    const r = scoreIt();
    state.result = r;
    const who = state.person ? state.person.firstName : "";
    $("r-greeting").textContent = who ? who + ", here's where you are." : "Here's where you are.";
    const bars = $("r-bars"); bars.innerHTML = "";
    const wins = $("r-wins"); wins.innerHTML = "";
    let block;
    if (r.mode === "type") {
      block = r.outcome;
      $("r-title").textContent = block.headline;
      $("r-score-wrap").hidden = true;
      $("r-tier").textContent = "You're " + block.name;
      $("r-bars-title").textContent = "Your mix";
      r.mix.forEach((m) => bars.append(bar(m.name, m.pct)));
      (block.wins || []).slice(0, 3).forEach((w) => { const li = document.createElement("li"); li.textContent = w; wins.append(li); });
    } else {
      block = r.tier;
      $("r-title").textContent = block.headline;
      $("r-score-wrap").hidden = false;
      $("r-score").textContent = r.pct + "%";
      $("r-tier").textContent = block.name;
      $("r-bars-title").textContent = "Your score by area";
      r.cats.forEach((c) => bars.append(bar(c.name, c.pct, c.notes && c.notes[c.band])));
      r.wins.forEach((w) => { const li = document.createElement("li"); li.textContent = w; wins.append(li); });
    }
    $("r-means").textContent = block.means;
    $("r-next-line").textContent = block.nextLine;
    renderCtas(r, block);
    const d = $("r-disclaimer"); d.hidden = !C.disclaimer; d.textContent = C.disclaimer || "";
    if (!state.sent) {
      state.sent = true;
      const rec = buildLeadRecord(r);
      rec.wins = Array.from(document.querySelectorAll("#r-wins li")).map((li) => li.textContent);
      const sendLead = (tries) => fetch("/api/scorecard", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(rec) })
        .then((r) => { if (!r.ok && tries > 0) setTimeout(() => sendLead(tries - 1), 4000); })
        .catch(() => { if (tries > 0) setTimeout(() => sendLead(tries - 1), 4000); });
      sendLead(2);
    }
  }

  // ---- Result calls to action
  function linkCta(text, href, extraClass) {
    const a = document.createElement("a");
    a.className = "cta" + (extraClass ? " " + extraClass : "");
    a.textContent = text; a.href = href;
    if (/^https?:/.test(href) && href.indexOf(location.origin) !== 0) { a.target = "_blank"; a.rel = "noopener"; }
    return a;
  }

  // One-tap newsletter sign-up. Every copy on the page swaps together.
  function signupCta() {
    const box = document.createElement("div");
    box.className = "signup";
    paintSignup(box);
    return box;
  }
  function paintSignup(box) {
    box.innerHTML = "";
    if (state.subscribed) {
      const p = document.createElement("p"); p.className = "signup-done"; p.setAttribute("role", "status");
      p.textContent = state.subscribedNow ? C.signup.done : C.signup.already;
      box.append(p);
      return;
    }
    const b = document.createElement("button");
    b.type = "button"; b.className = "cta"; b.textContent = C.signup.button;
    b.addEventListener("click", () => subscribe(b));
    box.append(b);
    if (state.signupError) {
      const e = document.createElement("p"); e.className = "field-error"; e.setAttribute("role", "alert");
      e.textContent = C.signup.failed; box.append(e);
    }
  }
  function subscribe(btn) {
    btn.disabled = true;
    fetch("/api/newsletter", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: state.person.email, source: "Findable Scorecard", website: state.person.website || "" })
    }).then((res) => {
      if (!res.ok) throw new Error("status " + res.status);
      state.subscribed = true; state.subscribedNow = true; state.signupError = false;
    }).catch(() => { state.signupError = true; })
      .then(() => { document.querySelectorAll(".signup").forEach(paintSignup); });
  }

  function shareRow(pct) {
    const row = document.createElement("p"); row.className = "share-row";
    const b = document.createElement("button"); b.type = "button"; b.className = "link-btn"; b.id = "share-btn";
    b.textContent = C.share.button;
    // The button itself reads "Copied" for 2 seconds; the hidden status tells screen readers.
    const status = document.createElement("span"); status.className = "share-status visually-hidden"; status.setAttribute("aria-live", "polite");
    const text = C.share.text.replace("{pct}", pct);
    b.addEventListener("click", () => {
      const copy = () => {
        const all = text + " " + C.share.url;
        const done = () => {
          b.textContent = C.share.copied; status.textContent = C.share.copied;
          setTimeout(() => { b.textContent = C.share.button; status.textContent = ""; }, 2000);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(all).then(done, () => { legacyCopy(all); done(); });
        } else { legacyCopy(all); done(); }
      };
      if (navigator.share) {
        navigator.share({ text: text, url: C.share.url }).catch((err) => { if (!err || err.name !== "AbortError") copy(); });
      } else { copy(); }
    });
    row.append(b, status);
    return row;
  }
  function legacyCopy(t) {
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
    ta.style.position = "absolute"; ta.style.left = "-9999px"; document.body.append(ta);
    ta.select(); try { document.execCommand("copy"); } catch (e) { /* nothing more to try */ }
    ta.remove();
  }

  function renderCtas(r, block) {
    const top = $("r-cta-top"), bottom = $("r-cta-bottom");
    top.innerHTML = ""; bottom.innerHTML = "";
    const hotLow = r.mode !== "type" && block.cta.signup && r.hot;
    if (hotLow) {
      // She's in the lowest tier but wants help soon: offer the call first, keep the newsletter second.
      const lead = document.createElement("p"); lead.className = "lead"; lead.textContent = C.hotCall.lead;
      top.append(lead, linkCta(C.hotCall.text, C.hotCall.href));
      bottom.append(signupCta());
    } else if (block.cta.signup) {
      top.append(signupCta());
      bottom.append(signupCta());
    } else {
      top.append(linkCta(block.cta.text, block.cta.href));
      bottom.append(linkCta(block.cta.text, block.cta.href));
    }
    if (r.mode !== "type") top.append(shareRow(r.pct));
  }

  // What a form tool would receive once this is wired up (a later, separate job).
  function buildLeadRecord(r) {
    const rec = {
      firstName: state.person && state.person.firstName,
      email: state.person && state.person.email,
      marketingConsent: !!(state.person && state.person.marketingConsent),
      mode: r.mode, hotLead: r.hot, insights: r.insights,
      utm: state.utm, completedAt: new Date().toISOString(),
      website: (state.person && state.person.website) || ""   // honeypot, always empty for people
    };
    if (r.mode === "type") { rec.outcome = r.outcome.name; }
    else {
      rec.scorePercent = r.pct; rec.tier = r.tier.name;
      rec.categories = Object.fromEntries(r.cats.map((c) => [c.name, c.pct]));
    }
    return rec;
  }

  $("retake-btn").addEventListener("click", () => {
    state.picks.fill(null); state.i = 0; renderQuestion(); show("screen-question");
  });

  renderStart();
})();

/* =====================================================================
   REVEAL: presentation only. Counts the score up, fills the ring and
   grows the bars when the result screen appears. Changes no logic.
   ===================================================================== */
(function () {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const result = document.getElementById("screen-result");
  const scoreEl = document.getElementById("r-score");
  const ring = document.getElementById("score-ring");
  if (!result || !scoreEl || !ring) return;

  function reveal() {
    const target = parseInt(scoreEl.textContent, 10);
    if (isNaN(target)) return;
    const fills = Array.from(result.querySelectorAll(".fill"));
    const finalWidths = fills.map((f) => f.style.width);
    if (reduce) { ring.style.setProperty("--pct", target); return; }
    fills.forEach((f) => { f.style.transition = "none"; f.style.width = "0%"; });
    ring.style.setProperty("--pct", 0);
    scoreEl.textContent = "0%";
    const t0 = performance.now(), dur = 1100;
    const ease = (x) => 1 - Math.pow(1 - x, 3);
    function step(now) {
      const p = Math.min(1, (now - t0) / dur), v = Math.round(ease(p) * target);
      scoreEl.textContent = v + "%";
      ring.style.setProperty("--pct", v);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    fills.forEach((f, i) => setTimeout(() => { f.style.transition = ""; f.style.width = finalWidths[i]; }, 250 + i * 160));
  }

  new MutationObserver(() => { if (!result.hidden) reveal(); })
    .observe(result, { attributes: true, attributeFilter: ["hidden"] });
})();
